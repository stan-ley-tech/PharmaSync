spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: filesystem:migrations
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

pharmasync:
  jwt:
    secret: test-only-secret-key-not-for-production-test-only-secret-key
  rate-limit:
    capacity: 1000
    refill-tokens: 1000

logging:
  level:
    com.pharmasync: DEBUG
